<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Loops — 4:3 studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0d0e12; --card:#171920; --ink:#eceaf2;
    --line:#23252e; --muted:#6a6f80; --accent:#9aa0b8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
  }
  header{padding:44px 32px 20px;max-width:1180px;margin:0 auto}
  h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
  .sub{color:var(--muted);max-width:58ch;margin:0}
  .bar{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  }
  .bar label,.lbl{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  input[type=range]{width:120px;accent-color:var(--accent)}
  button.t{
    font:inherit;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 13px;border-radius:100px;cursor:pointer;transition:.18s;
  }
  button.t:hover{border-color:var(--ink);color:var(--ink)}
  button.t[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .scheme{
    display:inline-flex;align-items:center;gap:6px;margin-left:2px;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .scheme i{width:9px;height:9px;border-radius:50%;display:block;margin-right:-3px;border:1px solid rgba(128,128,128,.4)}

  main{max-width:1180px;margin:0 auto;padding:14px 32px 90px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px 26px}
  figure{margin:0;cursor:zoom-in}
  .frame{
    position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
    transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .35s;
  }
  figure:hover .frame{transform:translateY(-3px);box-shadow:0 20px 38px -20px rgba(0,0,0,.8)}
  canvas{display:block;width:100%;height:100%}
  figcaption{padding:11px 2px 0;display:flex;gap:10px;align-items:baseline}
  .idx{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .nm{font-weight:600;letter-spacing:-.01em}
  .note{color:var(--muted);font-size:12.5px;margin:3px 0 0 30px;max-width:40ch}
  .per{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  dialog{border:none;padding:0;background:none;max-width:92vw;max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
  .solo{width:min(86vw,940px)}
  .solo .row{display:flex;align-items:baseline;gap:12px;margin-top:14px;color:var(--ink)}
  .solo .row .nm{font-size:17px}
  .solo .row .note{color:var(--muted);margin:0 0 0 auto;text-align:right}
  .close{position:absolute;top:-34px;right:0;background:none;border:none;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}

  /* Embedded in the playground "Motion" section: drop our own chrome and the
     dark page container, and let each loop stand as its own card directly on
     the (light) playground background — matching the toy grid above it. */
  body.embedded{background:transparent;color:#1a1714}
  body.embedded header{display:none}
  body.embedded main{padding:0 0 4px}
  body.embedded figure{cursor:default}
  /* keep columns from ever exceeding the (sometimes narrow) iframe width,
     so captions don't get clipped by the parent's overflow:hidden */
  body.embedded .grid{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:40px 30px}
  body.embedded .frame{
    border-radius:12px;
    box-shadow:0 20px 44px -30px rgba(26,23,20,0.32);
  }
  body.embedded figure:hover .frame{box-shadow:0 26px 50px -30px rgba(26,23,20,0.4)}
  /* captions restyled for the light page */
  body.embedded figcaption{padding-top:14px}
  body.embedded .nm{font-family:"Funnel Display",Georgia,serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#1a1714}
  body.embedded .idx,body.embedded .per{color:#8a8578}
  body.embedded .scheme{display:none}
  body.embedded .note{color:#6f6a60}
</style>
</head>
<body>
<header>
  <h1>Loading Loops</h1>
  <p class="sub">Five seamless motion studies in a 4:3 frame. Each loops by construction — the last frame <em>is</em> the first frame — and each is pinned to its own colour scheme.</p>
  <div class="bar">
    <label>Speed <input id="speed" type="range" min="0.2" max="2" step="0.05" value="1"><span id="speedv" style="font-variant-numeric:tabular-nums;color:var(--ink)">1.00×</span></label>
    <button class="t" id="pause" aria-pressed="false">Pause</button>
    <button class="t" id="grid" aria-pressed="false">Show loop grid</button>
  </div>
</header>
<main><div class="grid" id="cards"></div></main>

<dialog id="modal"><div class="solo">
  <button class="close" id="closeBtn">Close ✕</button>
  <div class="frame"><canvas id="soloCanvas"></canvas></div>
  <div class="row"><span class="nm" id="soloName"></span><span class="note" id="soloNote"></span></div>
</div></dialog>

<script>
const EMBEDDED = window.self !== window.top;   // true inside the playground "Motion" iframe
if(EMBEDDED) document.body.classList.add('embedded');
const TAU=Math.PI*2;
const cl=(v,a,b)=>v<a?a:v>b?b:v;
const ss=t=>t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;
const fr=v=>((v%1)+1)%1;
function rot(x,y,a){const c=Math.cos(a),s=Math.sin(a);return{x:x*c-y*s,y:x*s+y*c};}
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toRGB=c=>c[0]==='#'?h2r(c):c.match(/[\d.]+/g).slice(0,3).map(Number);
const al=(c,a)=>'rgba('+toRGB(c).join(',')+','+a+')';
const mix=(c1,c2,t)=>{const a=toRGB(c1),b=toRGB(c2);
  return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')';};
const dk=(h,t)=>mix(h,'#000000',t);
const lt=(h,t)=>mix(h,'#ffffff',t);
function path(g,pts,close){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));if(close!==false)g.closePath();}

/* ───────────────── palettes ─────────────────
   page  card  ink   line  muted   a1/a2 accents
   sand  frame light        deep/glow/dim  dark-surface set          */
const PALETTES=[
 {id:'nocturne', name:'Nocturne',
  page:'#101119',card:'#1a1c27',ink:'#ece9f5',line:'#2a2d3c',muted:'#525873',
  a1:'#a98bff',a2:'#4fd6c0',sand:'#f0d59b',frame:'#343a4f',light:'#ece9f5',
  deep:'#080910',glow:'#7ec9ff',dim:'#242737'},
 {id:'riso', name:'Risograph',
  page:'#f3f1e8',card:'#eae7db',ink:'#1e1c19',line:'#d6d2c2',muted:'#a29d8d',
  a1:'#ff4d7d',a2:'#2f4fd8',sand:'#ffc93c',frame:'#1e1c19',light:'#fffdf5',
  deep:'#2f4fd8',glow:'#ff4d7d',dim:'#1e34a0'},
 {id:'acid', name:'Acid Mono',
  page:'#f2f2f0',card:'#e8e8e5',ink:'#141416',line:'#d4d4d0',muted:'#96968d',
  a1:'#c8f331',a2:'#141416',sand:'#c8f331',frame:'#141416',light:'#fbfbf8',
  deep:'#141416',glow:'#c8f331',dim:'#28282d'},
 {id:'deepsea', name:'Deep Sea',
  page:'#08181f',card:'#0e2530',ink:'#dff2ef',line:'#17394a',muted:'#3f6d7d',
  a1:'#ffab4a',a2:'#3fd0c9',sand:'#ffd79a',frame:'#123243',light:'#dff2ef',
  deep:'#041015',glow:'#3fd0c9',dim:'#0f2a36'},
 {id:'blueprint', name:'Blueprint',
  page:'#0b1a2b',card:'#10263c',ink:'#dbeaf7',line:'#1d3d5c',muted:'#5a7f9e',
  a1:'#7fd4ff',a2:'#ffd166',sand:'#ffd166',frame:'#0a1c2e',light:'#f2f9ff',
  deep:'#050f1a',glow:'#7fd4ff',dim:'#16324c'},
 {id:'signal', name:'Signal',
  page:'#111112',card:'#1a1a1c',ink:'#f3f1ec',line:'#2b2b2e',muted:'#77767a',
  a1:'#ff5a2b',a2:'#8fa3b8',sand:'#ffb066',frame:'#08080a',light:'#f3f1ec',
  deep:'#0a0a0c',glow:'#ff5a2b',dim:'#242427'},
 {id:'powder', name:'Powder',
  page:'#efeaf3',card:'#e6e0ed',ink:'#3a3348',line:'#d6cee2',muted:'#9e93b0',
  a1:'#e8879f',a2:'#7fa4e0',sand:'#f2cdb2',frame:'#5a5070',light:'#fbf8fd',
  deep:'#292236',glow:'#f7b3ca',dim:'#443c58'},
];
const PAL=Object.fromEntries(PALETTES.map(P=>[P.id,P]));
let C=PAL.nocturne;
function bg(g,c){g.fillStyle=c;g.fillRect(0,0,400,300);}

/* ───────────────── 02. HOURGLASS ───────────────── */
function hourglass(g,p){
  bg(g,C.card);
  const drain=0.78,H=76,WT=58,NK=5;
  const f=ss(cl(p/drain,0,1));
  const flip=p>drain?ss((p-drain)/(1-drain))*Math.PI:0;
  g.save();g.translate(200,150);g.rotate(flip);
  const topW=y=>lerp(NK,WT,(-y)/H), botW=y=>lerp(NK,WT,y/H);
  const glassTop=[[-WT,-H],[WT,-H],[NK,0],[-NK,0]];
  const glassBot=[[-NK,0],[NK,0],[WT,H],[-WT,H]];
  g.fillStyle=al(C.ink,.06);
  path(g,glassTop);g.fill();path(g,glassBot);g.fill();

  const r=1-f;
  if(r>0.012){
    g.save();path(g,glassTop);g.clip();
    const ly=-r*H, dip=Math.min(15,r*46);
    path(g,[[-NK,1],[NK,1],[topW(ly),ly],[0,ly+dip],[-topW(ly),ly]]);
    g.fillStyle=C.sand;g.fill();
    g.fillStyle=al(C.deep,.16);
    path(g,[[topW(ly),ly],[0,ly+dip],[-topW(ly),ly]]);g.fill();
    g.restore();
  }
  if(f>0.008){
    g.save();path(g,glassBot);g.clip();
    const ph=f*H*1.06, pw=Math.min(WT,13+f*WT*1.5), sh=Math.max(0,ph-pw*0.72);
    path(g,[[-pw,H],[pw,H],[pw,H-sh],[0,H-ph],[-pw,H-sh]]);
    g.fillStyle=C.sand;g.fill();
    g.fillStyle=al(C.light,.35);
    path(g,[[0,H-ph],[pw*0.55,H-sh-pw*0.28],[0,H-ph+8]]);g.fill();
    g.restore();
  }
  const landY=H-f*H*1.06;
  if(r>0.02){
    g.fillStyle=C.sand;g.globalAlpha=cl(r*14,0,1);
    for(let i=0;i<18;i++){
      const q=fr(p*22+i*0.6180339);
      const y=2+q*q*Math.max(6,landY-2);
      const x=Math.sin(i*12.9898)*2.6*(0.4+q);
      g.fillRect(x-1,y-1.6,2,3.2);
    }
    g.globalAlpha=1;
  }
  g.strokeStyle=C.ink;g.lineWidth=2.4;g.lineJoin='round';
  path(g,glassTop);g.stroke();path(g,glassBot);g.stroke();
  g.fillStyle=C.frame;
  g.fillRect(-WT-14,-H-13,(WT+14)*2,13);
  g.fillRect(-WT-14,H,(WT+14)*2,13);
  g.fillRect(-WT-10,-H,5,H*2);g.fillRect(WT+5,-H,5,H*2);
  g.strokeStyle=al(C.ink,.45);g.lineWidth=1.4;
  g.strokeRect(-WT-14,-H-13,(WT+14)*2,13);
  g.strokeRect(-WT-14,H,(WT+14)*2,13);
  g.restore();
}

/* ───────────────── 01. LOOM ───────────────── */
function loom(g,p){
  bg(g,C.card);
  const nW=11,x0=58,gap=(400-116)/(nW-1),fell=212,rowH=26;
  const rows=p*2, cur=Math.floor(rows), frac=rows-cur;
  const wx=i=>x0+i*gap;
  const dir=(cur%2===0)?1:-1;
  const sx=dir>0?lerp(38,362,frac):lerp(362,38,frac);
  const rowY=k=>fell-(rows-k)*rowH;
  const wefts=[];
  for(let k=cur;k>cur-8;k--){
    const y=rowY(k); if(y<26) continue;
    const a=cl((y-34)/76,0,1);
    let lo=34,hi=366;
    if(k===cur){ if(dir>0) hi=sx; else lo=sx; }
    wefts.push({k,y,a,lo,hi});
  }
  wefts.forEach(w=>{
    g.globalAlpha=w.a;
    g.strokeStyle=(w.k%2===0)?C.a1:C.a2;
    g.lineWidth=11;g.lineCap='round';
    g.beginPath();g.moveTo(w.lo,w.y);g.lineTo(w.hi,w.y);g.stroke();
  });
  g.globalAlpha=1;
  for(let i=0;i<nW;i++){
    const x=wx(i);
    g.strokeStyle=C.muted;g.lineWidth=5;g.lineCap='round';
    g.beginPath();g.moveTo(x,20);g.lineTo(x,fell);g.stroke();
    g.strokeStyle=al(C.muted,.36);g.lineWidth=4;
    g.beginPath();g.moveTo(x,fell);
    g.quadraticCurveTo(x+Math.sin(i*1.7+p*TAU)*4,fell+38,200+(x-200)*0.62,286);
    g.stroke();
  }
  wefts.forEach(w=>{
    g.globalAlpha=w.a;
    g.strokeStyle=(w.k%2===0)?C.a1:C.a2;
    g.lineWidth=11;g.lineCap='butt';
    for(let i=0;i<nW;i++){
      if((i+w.k)%2!==0) continue;
      const x=wx(i); if(x<w.lo-6||x>w.hi+6) continue;
      g.beginPath();g.moveTo(x-gap*0.34,w.y);g.lineTo(x+gap*0.34,w.y);g.stroke();
    }
  });
  g.globalAlpha=1;
  const sy=rowY(cur);
  g.save();g.translate(sx,sy);g.scale(dir,1);
  g.fillStyle=C.frame;
  g.beginPath();g.moveTo(-26,0);g.quadraticCurveTo(-8,-9,26,0);
  g.quadraticCurveTo(-8,9,-26,0);g.fill();
  g.strokeStyle=C.ink;g.lineWidth=1.6;g.stroke();
  g.fillStyle=(cur%2===0)?C.a1:C.a2;
  g.beginPath();g.ellipse(0,0,9,4.4,0,0,TAU);g.fill();
  g.restore();
  const gr=g.createLinearGradient(0,10,0,116);
  gr.addColorStop(0,C.card);gr.addColorStop(.55,al(C.card,.72));gr.addColorStop(1,al(C.card,0));
  g.fillStyle=gr;g.fillRect(0,0,400,116);
}

/* ───────────────── 04. MÖBIUS RIBBON ───────────────── */
function mobius(g,p){
  bg(g,C.card);
  const N=52,RX=142,RY=176,HW=27;
  const tiles=[];
  for(let i=0;i<N;i++){
    const u=TAU*((i+p)/N);
    const cx=RX*Math.cos(u), cy=RY*Math.sin(2*u)/2;
    const tx=-RX*Math.sin(u), ty=RY*Math.cos(2*u);
    const m=Math.hypot(tx,ty)||1;
    const z=Math.sin(u), tau=u/2;
    tiles.push({cx,cy,tx:tx/m,ty:ty/m,nx:-ty/m,ny:tx/m,z,
                w:HW*Math.cos(tau),sc:1+0.16*z,len:(m*TAU/N)*0.60,tau});
  }
  tiles.sort((a,b)=>a.z-b.z);
  g.save();g.translate(200,150);
  tiles.forEach(t=>{
    const S=t.sc,X=t.cx*S,Y=t.cy*S,w=t.w*S,L=t.len*S;
    const front=Math.cos(t.tau)>0, edge=Math.abs(Math.cos(t.tau));
    const depth=0.40+0.60*((t.z+1)/2);
    g.fillStyle=mix(C.card,front?C.a1:C.a2,depth);
    path(g,[
      [X+t.nx*w-t.tx*L, Y+t.ny*w-t.ty*L],
      [X+t.nx*w+t.tx*L, Y+t.ny*w+t.ty*L],
      [X-t.nx*w+t.tx*L, Y-t.ny*w+t.ty*L],
      [X-t.nx*w-t.tx*L, Y-t.ny*w-t.ty*L]]);
    g.fill();
    g.strokeStyle=al(C.ink,.20*edge);g.lineWidth=0.8;g.stroke();
  });
  g.restore();
}

/* ───────────────── 03. INK DROP ───────────────── */
function drop(g,p){
  bg(g,C.card);
  const surf=206;
  const pg=g.createLinearGradient(0,surf,0,300);
  pg.addColorStop(0,C.deep);pg.addColorStop(1,dk(C.deep,.4));
  g.fillStyle=pg;g.fillRect(0,surf,400,100);
  g.strokeStyle=al(C.glow,.35);g.lineWidth=1.2;
  g.beginPath();g.moveTo(0,surf+.6);g.lineTo(400,surf+.6);g.stroke();
  g.save();g.beginPath();g.rect(0,surf,400,100);g.clip();
  for(let k=0;k<3;k++){
    const a=(p+k)/3, r=10+a*150;
    g.globalAlpha=Math.pow(1-a,1.4)*0.95;
    g.strokeStyle=C.glow;g.lineWidth=3.6*(1-a)+0.6;
    g.beginPath();g.ellipse(200,surf+4,r,r*0.30,0,0,TAU);g.stroke();
    g.globalAlpha=Math.pow(1-a,1.6)*0.30;
    g.beginPath();g.ellipse(200,surf+4,r*0.72,r*0.22,0,0,TAU);g.stroke();
  }
  g.globalAlpha=1;g.restore();
  const c=p/0.2;
  if(c<1){
    g.fillStyle=C.ink;
    const rr=6+c*26, hh=Math.sin(Math.PI*c)*15;
    for(let i=0;i<9;i++){
      const a=i*TAU/9+0.3, x=200+Math.cos(a)*rr,
            y=surf+4+Math.sin(a)*rr*0.3-hh*(0.5+0.5*Math.sin(a)), s=3.4*(1-c);
      if(s>0.2){g.beginPath();g.ellipse(x,y,s,s*1.25,0,0,TAU);g.fill();}
    }
    const jh=Math.sin(Math.PI*Math.min(1,c*1.15))*40;
    g.beginPath();g.moveTo(200-6*(1-c*0.6),surf+4);
    g.quadraticCurveTo(200,surf+4-jh,200+6*(1-c*0.6),surf+4);g.fill();
    if(c>0.45){g.beginPath();g.arc(200,surf+4-jh-4,3.6*(c-0.4),0,TAU);g.fill();}
  }
  const y=44+(surf-44)*p*p, st=1+p*1.05;
  g.fillStyle=C.ink;
  g.save();g.translate(200,y);g.scale(1/Math.sqrt(st),st);
  g.beginPath();g.arc(0,0,8,0,TAU);g.fill();g.restore();
  g.globalAlpha=.2;g.fillStyle=C.light;
  g.beginPath();g.ellipse(197,y-4*st,2,3,-0.4,0,TAU);g.fill();g.globalAlpha=1;
  g.fillStyle=C.frame;
  g.beginPath();g.moveTo(184,10);g.lineTo(216,10);g.lineTo(207,36);g.lineTo(193,36);g.fill();
  const sw=cl((p-0.42)/0.56,0,1);
  if(sw>0){g.fillStyle=C.ink;g.beginPath();
    g.ellipse(200,36+sw*7,3+sw*5,3+sw*6.5,0,0,TAU);g.fill();}
}

/* ───────────────── 05. FLIP-DOT WAVE ───────────────── */
function flipdots(g,p){
  bg(g,C.deep);
  const cols=14,rows=10,sp=26,r=10.4;
  const x0=200-(cols-1)*sp/2, y0=150-(rows-1)*sp/2;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const x=x0+i*sp, y=y0+j*sp;
    g.fillStyle=dk(C.deep,.45);g.beginPath();g.arc(x,y,r+1.6,0,TAU);g.fill();
    const m=((p*2-(i*0.052+j*0.075))%2+2)%2;
    const half=Math.floor(m), f=cl((m-half)/0.4,0,1);
    const sy=Math.max(0.05,Math.abs(Math.cos(Math.PI*f)));
    const lit=(half===0)?(f<0.5):(f>=0.5);
    g.fillStyle=lit?C.glow:C.dim;
    g.beginPath();g.ellipse(x,y,r,r*sy,0,0,TAU);g.fill();
    if(lit){
      g.fillStyle=al('#ffffff',.28);
      g.beginPath();g.ellipse(x-r*0.3,y-r*sy*0.34,r*0.34,r*sy*0.3,0,0,TAU);g.fill();
    }
    if(sy<0.34){g.strokeStyle=al(dk(C.deep,.6),.75);g.lineWidth=1;
      g.beginPath();g.moveTo(x-r,y);g.lineTo(x+r,y);g.stroke();}
  }
  const vg=g.createRadialGradient(200,150,120,200,150,250);
  vg.addColorStop(0,al(C.deep,0));vg.addColorStop(1,al(dk(C.deep,.5),.55));
  g.fillStyle=vg;g.fillRect(0,0,400,300);
}

/* ───────────────── 06. PENROSE ESCALATOR ───────────────── */
function penrose(g,p){
  bg(g,C.card);
  const ax=30,ay=-17, bx=42,by=24, H=11;
  const sx=ax, sy=ay-H;              /* one module = (30,-28) */
  const P0x=44,P0y=256, drop=46;
  const sky=g.createLinearGradient(0,0,0,300);
  sky.addColorStop(0,mix(C.card,C.light,.30));sky.addColorStop(1,C.card);
  g.fillStyle=sky;g.fillRect(0,0,400,300);

  const la=Math.hypot(ax,ay), lb=Math.hypot(bx,by);
  const ua=[ax/la,ay/la], ub=[bx/lb,by/lb];
  function ball(cx,cy,hop,rise){
    const R=12;
    const c=Math.max(0,1-Math.min(p,1-p)/0.07);   /* 1 at the instant of contact */
    const spd=Math.abs(1-2*p);                      /* fastest at contact, 0 at apex */
    const sy=1+0.16*spd*(1-c)-0.28*c, sx=1/sy;
    g.save();
    g.transform(ua[0],ua[1],ub[0],ub[1],cx,cy);
    g.fillStyle=al(dk(C.frame,.55),.34*(1-0.62*rise));
    g.beginPath();g.arc(0,0,R*(1-0.42*rise),0,TAU);g.fill();
    g.restore();
    const by2=cy+hop-R*sy;
    const gr=g.createRadialGradient(cx-R*0.42,by2-R*0.5,R*0.12,cx,by2,R*1.25);
    gr.addColorStop(0,lt(C.a1,.42));gr.addColorStop(.55,C.a1);gr.addColorStop(1,dk(C.a1,.34));
    g.fillStyle=gr;
    g.beginPath();g.ellipse(cx,by2,R*sx,R*sy,0,0,TAU);g.fill();
    g.fillStyle=al(C.light,.5);
    g.beginPath();g.ellipse(cx-R*0.36,by2-R*0.44,R*0.24*sx,R*0.17*sy,-0.5,0,TAU);g.fill();
  }

  g.save();
  g.translate(-sx*p,-sy*p);
  for(let i=12;i>=-3;i--){
    const x=P0x+i*sx, y=P0y+i*sy;
    const A=[x,y], B=[x+ax,y+ay], Cc=[x+ax+bx,y+ay+by], D=[x+bx,y+by];
    g.fillStyle=al(C.deep,.10);
    path(g,[[D[0]-9,D[1]+drop+7],[Cc[0]-9,Cc[1]+drop+7],[Cc[0],Cc[1]+drop],[D[0],D[1]+drop]]);g.fill();
    g.fillStyle=C.frame;
    path(g,[D,Cc,[Cc[0],Cc[1]+drop],[D[0],D[1]+drop]]);g.fill();
    g.fillStyle=C.a2;
    path(g,[A,D,[D[0],D[1]+H],[A[0],A[1]+H]]);g.fill();
    g.fillStyle=mix(C.light,C.card,.06);
    path(g,[A,B,Cc,D]);g.fill();
    g.strokeStyle=al(C.ink,.34);g.lineWidth=1.1;g.lineJoin='round';g.stroke();
    if(i===4){
      const HOP=38, hop=-4*HOP*p*(1-p);
      ball(P0x+(4+p)*sx+ax/2+bx/2, P0y+(4+p)*sy+ay/2+by/2, hop, -hop/HOP);
    }
  }
  g.restore();
}

/* ───────────────── 07. ORIGAMI FOLD ───────────────── */
const OFACE=[
  {pts:[[-45,-45],[45,-45],[45,45]], op:-1},
  {pts:[[-45,-45],[45,45],[-45,45]], op:-1},
  {pts:[[-45,-45],[0,-90],[45,-45]], op:0},
  {pts:[[45,-45],[90,0],[45,45]],    op:1},
  {pts:[[45,45],[0,90],[-45,45]],    op:2},
  {pts:[[-45,45],[-90,0],[-45,-45]], op:3},
];
const OOPS=[
  {a:[-45,-45],b:[45,-45], side:-1,w:[0.00,0.40]},
  {a:[45,-45], b:[45,45],  side: 1,w:[0.08,0.48]},
  {a:[45,45],  b:[-45,45], side: 1,w:[0.16,0.56]},
  {a:[-45,45], b:[-45,-45],side:-1,w:[0.24,0.64]},
];
const OGL={a:[-45,-45],b:[45,45],side:1,w:[0.70,1.00]};
function ofold(P,op){
  const dx0=op.b[0]-op.a[0], dy0=op.b[1]-op.a[1], L=Math.hypot(dx0,dy0);
  const dx=dx0/L, dy=dy0/L, nx=-dy, ny=dx;
  const px=P[0]-op.a[0], py=P[1]-op.a[1];
  const t=px*dx+py*dy, d=px*nx+py*ny;
  if(d*op.side<=0.0001) return P;
  const dd=d*Math.cos(op.th);
  return [op.a[0]+dx*t+nx*dd, op.a[1]+dy*t+ny*dd];
}
function oside(P,op){
  const dx0=op.b[0]-op.a[0], dy0=op.b[1]-op.a[1], L=Math.hypot(dx0,dy0);
  return ((P[0]-op.a[0])*(-dy0/L)+(P[1]-op.a[1])*(dx0/L))*op.side>0.0001;
}
function origami(g,p){
  bg(g,C.card);
  const t=(1-Math.cos(TAU*p))/2;
  const th=w=>Math.PI*ss(cl((t-w[0])/(w[1]-w[0]),0,1));
  const ops=OOPS.map(o=>({a:o.a,b:o.b,side:o.side,th:th(o.w)}));
  const gl={a:OGL.a,b:OGL.b,side:OGL.side,th:th(OGL.w)};

  const polys=OFACE.map(f=>{
    const chain=f.op<0?[gl]:[ops[f.op],gl];
    const cen=[f.pts.reduce((s,q)=>s+q[0],0)/f.pts.length,
               f.pts.reduce((s,q)=>s+q[1],0)/f.pts.length];
    let c=cen, flips=0, top=0;
    chain.forEach((op,k)=>{
      if(oside(c,op)&&Math.cos(op.th)<0){flips++; if(k===chain.length-1)top=1;}
      c=ofold(c,op);
    });
    let pts=f.pts;
    chain.forEach(op=>{pts=pts.map(q=>ofold(q,op));});
    return {pts,flips,z:(f.op<0?0:1)+top*2,cy:c[1]-c[0]};
  });
  polys.sort((A,B)=>A.z-B.z||B.cy-A.cy);

  const gf=(1-Math.cos(gl.th))/2;
  g.save();g.translate(200-19.5*gf,150+19.5*gf);
  g.rotate(Math.sin(TAU*p)*0.06);g.scale(1.3,1.3);
  g.fillStyle=al(C.deep,.11);
  g.beginPath();g.ellipse(4,102,66-t*16,9,0,0,TAU);g.fill();
  polys.forEach(P=>{
    const back=P.flips%2===1;
    g.fillStyle=back?C.a1:C.light;
    path(g,P.pts);g.fill();
    if(P.flips>0){g.fillStyle=al(C.deep,.055*P.flips);g.fill();}
    g.strokeStyle=al(C.ink,back?.26:.17);g.lineWidth=1/1.3;g.lineJoin='round';g.stroke();
  });
  g.restore();
}

/* ───────────────── 08. SOPHIA — SPLIT-FLAP ───────────────── */
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const NAME='SOPHIA';
function flapChar(g,ch,cx,cy,w,h,half){
  g.save();g.beginPath();
  if(half>0) g.rect(cx-w/2,cy-h/2,w,h/2); else g.rect(cx-w/2,cy,w,h/2);
  g.clip();
  g.fillStyle=C.sand;g.textAlign='center';g.textBaseline='middle';
  g.font='700 47px ui-monospace,SFMono-Regular,Menlo,monospace';
  g.fillText(ch,cx,cy+1);
  g.restore();
}
function splitflap(g,p){
  bg(g,C.card);
  const w=50,h=74,gap=7, n=NAME.length;
  const x0=200-(n*w+(n-1)*gap)/2+w/2, cy=150;
  const FACE=lt(C.frame,.12), LEAFA=lt(C.frame,.20), LEAFB=lt(C.frame,.05);
  const bw=n*w+(n-1)*gap+32;
  const board=()=>{g.beginPath();g.roundRect(200-bw/2,cy-h/2-19,bw,h+38,12);g.fill();};
  g.save();
  g.fillStyle=C.frame;
  g.shadowColor=al(dk(C.frame,.6),.34);g.shadowBlur=34;g.shadowOffsetY=22;board();
  g.shadowColor=al(dk(C.frame,.6),.30);g.shadowBlur=14;g.shadowOffsetY=8;board();
  g.shadowColor=al(dk(C.frame,.6),.26);g.shadowBlur=5;g.shadowOffsetY=2;board();
  g.restore();
  g.fillStyle=C.frame;board();
  g.strokeStyle=al(C.light,.12);g.lineWidth=1;g.stroke();

  for(let k=0;k<n;k++){
    const cx=x0+k*(w+gap);
    const base=AZ.indexOf(NAME[k]);
    const s0=0.05+k*0.028, s1=0.60+k*0.058;
    const spinning=p>s0&&p<s1;
    let cur=NAME[k], nxt=NAME[k], f=0;
    if(spinning){
      const raw=cl((p-s0)/(s1-s0),0,1)*26, idx=Math.min(25,Math.floor(raw));
      f=raw-idx; cur=AZ[(base+idx)%26]; nxt=AZ[(base+idx+1)%26];
    }
    g.fillStyle=FACE;
    g.beginPath();g.roundRect(cx-w/2,cy-h/2,w,h,5);g.fill();
    g.save();g.beginPath();g.roundRect(cx-w/2,cy-h/2,w,h,5);g.clip();
    flapChar(g,spinning?nxt:cur,cx,cy,w,h,1);
    flapChar(g,cur,cx,cy,w,h,-1);
    if(spinning){
      const c=Math.cos(Math.PI*f), sc=Math.max(0.02,Math.abs(c));
      g.save();
      g.translate(cx,cy);g.scale(1,sc);g.translate(-cx,-cy);
      g.fillStyle=c>0?LEAFA:LEAFB;
      g.beginPath();g.rect(cx-w/2,c>0?cy-h/2:cy,w,h/2);g.fill();
      flapChar(g,c>0?cur:nxt,cx,cy,w,h,c>0?1:-1);
      g.restore();
      g.fillStyle=al(dk(C.frame,.6),.34*(1-sc));
      g.fillRect(cx-w/2,cy-h/2,w,h);
    }
    g.strokeStyle=dk(C.frame,.55);g.lineWidth=2;
    g.beginPath();g.moveTo(cx-w/2,cy);g.lineTo(cx+w/2,cy);g.stroke();
    g.restore();
    g.fillStyle=dk(C.frame,.4);
    g.fillRect(cx-w/2-3,cy-4,4,8);g.fillRect(cx+w/2-1,cy-4,4,8);
    g.strokeStyle=al(C.light,.10);g.lineWidth=1;
    g.beginPath();g.roundRect(cx-w/2,cy-h/2,w,h,5);g.stroke();
  }
}

/* ───────────────── registry ───────────────── */
const ANIMS=[
 {n:'Loom',          pal:'deepsea',  note:'Weft alternates over/under; two rows per cycle restores the parity.',     per:2.6, d:loom},
 {n:'Hourglass',     pal:'riso',     note:'Drains, then flips 180°. Rotational symmetry hides the seam.',            per:4.6, d:hourglass},
 {n:'Ink Drop',      pal:'nocturne', note:'Three ripple generations overlap, each offset by a third of a period.',   per:1.7, d:drop},
 {n:'Möbius Ribbon', pal:'riso',     note:'Tiles advance one slot per cycle. Half-twist swaps the two faces.',       per:4.4, d:mobius},
 {n:'Flip-Dot Wave', pal:'acid',     note:'Each dot flips twice per cycle, so every dot lands on its start face.',   per:2.8, d:flipdots},
 {n:'Penrose Escalator',pal:'signal',  note:'The stair slides down exactly one tread while the climber steps up one.',   per:2.2, d:penrose},
 {n:'Origami Fold',  pal:'blueprint',   note:'Folds, then unfolds along the same creases — the back half runs in reverse.',per:5.0, d:origami},
 {n:'Sophia — Split-Flap',pal:'acid',  note:'Every drum spins through all 26 letters and lands back on its own.',     per:5.6, d:splitflap},
];

/* ───────────────── plumbing ───────────────── */
const cardsEl=document.getElementById('cards'); const items=[];
function chip(P){
  return '<span class="scheme"><i style="background:'+P.a1+'"></i>'+
         '<i style="background:'+P.a2+'"></i>'+P.name+'</span>';
}
ANIMS.forEach((a,i)=>{
  const P=PAL[a.pal];
  const f=document.createElement('figure');
  f.innerHTML='<div class="frame"><canvas></canvas></div>'+
    '<figcaption><span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
    '<span class="nm">'+a.n+'</span>'+chip(P)+
    '<span class="per">'+a.per.toFixed(1)+'s</span></figcaption>'+
    '<p class="note">'+a.note+'</p>';
  cardsEl.appendChild(f);
  const fr_=f.querySelector('.frame');
  fr_.style.background=P.card; fr_.style.borderColor=P.line;
  const cv=f.querySelector('canvas');
  items.push({a,cv,g:cv.getContext('2d')});
  if(!EMBEDDED) f.addEventListener('click',()=>openSolo(i));
});

/* When embedded, report our content height so the parent iframe can size
   itself exactly — no inner scrollbar, clean reflow at every breakpoint. */
if(EMBEDDED){
  const postH=()=>parent.postMessage(
    {type:'loadingLoopsHeight',height:Math.ceil(document.documentElement.scrollHeight)},'*');
  window.addEventListener('load',()=>{postH();setTimeout(postH,250);});
  window.addEventListener('resize',postH);
  if(window.ResizeObserver) new ResizeObserver(postH).observe(document.body);
}

const soloCv=document.getElementById('soloCanvas'), soloG=soloCv.getContext('2d');
const modal=document.getElementById('modal');
let solo=null;
function openSolo(i){
  solo=ANIMS[i];
  const P=PAL[solo.pal];
  document.getElementById('soloName').textContent=solo.n;
  document.getElementById('soloNote').textContent=solo.note;
  const fr_=modal.querySelector('.frame');
  fr_.style.background=P.card; fr_.style.borderColor=P.line;
  modal.showModal();
}
document.getElementById('closeBtn').onclick=()=>modal.close();
modal.addEventListener('close',()=>{if(!modal.open) solo=null;});
modal.addEventListener('click',e=>{if(e.target===modal)modal.close();});

let speed=1,paused=false,showGrid=false,clock=0,last=performance.now();
const sEl=document.getElementById('speed'), sv=document.getElementById('speedv');
sEl.oninput=()=>{speed=+sEl.value; sv.textContent=speed.toFixed(2)+'×';};
const pb=document.getElementById('pause');
pb.onclick=()=>{paused=!paused;pb.setAttribute('aria-pressed',paused);pb.textContent=paused?'Play':'Pause';};
const gb=document.getElementById('grid');
gb.onclick=()=>{showGrid=!showGrid;gb.setAttribute('aria-pressed',showGrid);};

function fit(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h) return false;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  }
  return true;
}
function render(g,cv,a,t){
  C=PAL[a.pal];
  const s=cv.width/400;
  g.setTransform(s,0,0,s,0,0);
  a.d(g,fr(t/a.per),400,300);
  if(showGrid){
    g.strokeStyle=al(C.a1,.4);g.lineWidth=1;
    for(let k=1;k<4;k++){
      g.beginPath();g.moveTo(k*100,0);g.lineTo(k*100,300);g.stroke();
      g.beginPath();g.moveTo(0,k*75);g.lineTo(400,k*75);g.stroke();
    }
    g.fillStyle=C.a1;g.fillRect(0,294,400*fr(t/a.per),6);
  }
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused) clock+=dt*speed;
  items.forEach(it=>{if(fit(it.cv)) render(it.g,it.cv,it.a,clock);});
  if(solo&&fit(soloCv)) render(soloG,soloCv,solo,clock);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
